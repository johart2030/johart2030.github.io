<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>.WAV Player</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32-wav-player-html.png">
    <link rel="icon" type="image/x-icon" href="favicon-wav-player-html.ico">

<style>
    :root{
        color-scheme: light;
        --ink:#17243b;
        --muted:#61708a;
        --line:#dce5f2;
        --blue:#2463eb;
        --blue-dark:#1749bd;
        --surface:#fff;
        --page:#f3f7fc;
        font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    body{
        min-height:100vh;
        margin:0;
        padding:clamp(18px,4vw,44px) 20px 48px;
        color:var(--ink);
        background:
            radial-gradient(ellipse at 12% 0%,rgba(68,132,255,.22),transparent 38rem),
            linear-gradient(160deg,#eaf2ff 0%,var(--page) 40%,#f8faff 100%);
    }
    .app-shell{width:min(100%,1040px);margin:0 auto}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:44px}
    .brand{display:flex;align-items:center;gap:11px;color:#263b5c;font-size:14px;font-weight:750;letter-spacing:.04em}
    .brand-mark{
        display:grid;place-items:center;width:38px;height:38px;border-radius:13px;
        color:#fff;background:linear-gradient(145deg,#3983ff,#2454d7);
        box-shadow:0 7px 16px rgba(36,99,235,.25);font-size:19px
    }
    #homeBtn,button,.file-choice{
        min-height:44px;border:1px solid var(--line);border-radius:12px;
        background:var(--surface);color:var(--ink);font:inherit;font-weight:650;
        cursor:pointer;transition:background .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease
    }
    #homeBtn{padding:0 16px;box-shadow:0 2px 7px rgba(26,50,87,.06)}
    #homeBtn:hover,.file-choice:hover{border-color:#b9c9e4;background:#f7faff}
    button:focus-visible,.file-choice:focus-within,#homeBtn:focus-visible{outline:3px solid rgba(36,99,235,.28);outline-offset:2px}
    button:active,#homeBtn:active{transform:translateY(1px)}
    .hero{max-width:700px;margin:0 auto 30px;text-align:center}
    .eyebrow{margin:0 0 12px;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;color:#142542;font-size:clamp(38px,7vw,62px);line-height:1.02;letter-spacing:-.055em}
    .hero-copy{max-width:580px;margin:17px auto 0;color:var(--muted);font-size:16px;line-height:1.65}
    .panel{
        padding:clamp(18px,3vw,28px);border:1px solid rgba(214,225,241,.9);border-radius:22px;
        background:rgba(255,255,255,.88);box-shadow:0 18px 48px rgba(31,58,99,.09),0 2px 6px rgba(31,58,99,.04);
        backdrop-filter:blur(10px)
    }
    .panel-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
    .panel-heading h2{margin:0;font-size:18px;letter-spacing:-.02em}
    .panel-heading p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
    #controls{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
    #loadFolderBtn,#clearBtn{padding:0 16px}
    #loadFolderBtn{border-color:var(--blue);background:var(--blue);color:#fff;box-shadow:0 5px 12px rgba(36,99,235,.18)}
    #loadFolderBtn:hover{border-color:var(--blue-dark);background:var(--blue-dark)}
    .file-choice{display:inline-flex;align-items:center;gap:9px;padding:0 15px}
    .file-choice span{font-size:14px}
    #fileInput{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;clip-path:inset(50%);border:0}
    #clearBtn{color:#465773}
    #clearBtn:hover{border-color:#f1c5c5;background:#fff6f6;color:#a52f3b}
    #dropZone{
        display:flex;flex:1 1 240px;align-items:center;justify-content:center;min-height:52px;
        padding:12px 16px;border:1.5px dashed #b9c9e2;border-radius:12px;
        background:#f7faff;color:#667894;text-align:center;font-size:13px;font-weight:550;transition:.16s
    }
    .soundboard{margin-top:24px}
    .soundboard-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px}
    .soundboard-heading h2{margin:0;font-size:16px;letter-spacing:-.01em}
    .soundboard-heading span{color:var(--muted);font-size:12px}
    .soundboard>button{
        display:block;margin:0 0 14px;padding:0 16px;border-color:#cad7ea;background:#eaf1fc;color:#294267
    }
    .soundboard>button:hover{border-color:#aabfe0;background:#e1ebfa}
    .grid{
        display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));
        align-items:stretch;gap:12px;width:100%;
    }
    .grid button{
        display:flex;align-items:center;justify-content:center;width:100%;min-width:0;min-height:60px;
        padding:15px 18px;border-color:#dbe5f3;border-radius:14px;background:#fff;
        box-shadow:0 3px 9px rgba(31,58,99,.045);font-size:14px;line-height:1.45;text-align:center;
        white-space:normal;overflow-wrap:anywhere;word-break:normal
    }
    .grid button:hover{transform:translateY(-2px);border-color:#abc4f4;background:#f5f8ff;box-shadow:0 8px 18px rgba(36,99,235,.1)}
    @media(max-width:600px){
        body{padding:16px 14px 30px}
        .topbar{margin-bottom:34px}
        .brand{font-size:12px}
        .panel-heading{align-items:flex-start}
        #controls>*{flex:1 1 calc(50% - 6px)}
        #dropZone{flex-basis:100%}
        .grid{grid-template-columns:1fr}
        .grid button{min-height:54px}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<body>

<main class="app-shell">
    <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">♫</span><span>SOUND EFFECTS</span></div>
        <button id="homeBtn" type="button">⌂ &nbsp;Home</button>
    </header>

    <section class="hero" aria-labelledby="pageTitle">
        <p class="eyebrow">Your cues, one tap away</p>
        <h1 id="pageTitle">.WAV Player</h1>
        <p class="hero-copy">Build a soundboard for your production. Load WAV files below, then tap a cue to play it.</p>
    </section>

    <section class="panel" aria-label="Load sound effects">
        <div class="panel-heading">
            <div><h2>Add your sound effects</h2><p>Choose a folder or files, or drop WAV files into the area.</p></div>
        </div>
        <div id="controls">
            <button id="loadFolderBtn" type="button">Load folder</button>
            <label class="file-choice">
                <input id="fileInput" type="file" accept=".wav,audio/wav" multiple>
                <span>Choose .wav files</span>
            </label>
            <button id="clearBtn" type="button">Clear sounds</button>
            <div id="dropZone">↧ &nbsp;Drop .wav files here</div>
        </div>
    </section>

    <section class="soundboard" aria-label="Soundboard">
        <div class="soundboard-heading"><h2>Your soundboard</h2><span>Tap a button to play</span></div>
        <div id="buttons" class="grid" aria-label="Sound buttons"></div>
    </section>
</main>

<script>
const container = document.getElementById('buttons');
const loadFolderBtn = document.getElementById('loadFolderBtn');
const fileInput = document.getElementById('fileInput');
const clearBtn = document.getElementById('clearBtn');
const dropZone = document.getElementById('dropZone');

const objectUrls = [];
let currentAudio = null;  // Keep track of the currently playing audio

// Function to stop all playing audio
function stopAllAudio() {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
    }
}

function addButton(label, src, title) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = label;
    btn.title = title || label;
    btn.dataset.src = src;

    btn.addEventListener('click', () => {
        stopAllAudio(); // Stop any audio currently playing
        currentAudio = new Audio(btn.dataset.src);
        currentAudio.play().catch(err => {
            console.error('Audio failed', err);
            alert('Could not play ' + (title || label));
        });
    });

    container.appendChild(btn);
}

// Add a Stop All button at the top
const stopAllBtn = document.createElement('button');
stopAllBtn.type = 'button';
stopAllBtn.textContent = 'Stop All';
stopAllBtn.addEventListener('click', stopAllAudio);
container.parentNode.insertBefore(stopAllBtn, container);

function filenameLabel(name){
    return name.replace(/\.wav$/i,'');
}

async function handleFile(file){
    if(!/\.wav$/i.test(file.name)) return;
    const url = URL.createObjectURL(file);
    objectUrls.push(url);
    addButton(filenameLabel(file.name), url, file.name);
}

function handleFileList(list){
    Array.from(list || []).forEach(handleFile);
}

fileInput.addEventListener('change', e=>{
    handleFileList(e.target.files);
    fileInput.value='';
});

['dragenter','dragover','dragleave','drop'].forEach(evt =>
    dropZone.addEventListener(evt, e=>e.preventDefault())
);

dropZone.addEventListener('dragover', () => {
    dropZone.style.borderColor = '#7ca5ff';
    dropZone.style.background = '#fff';
});

dropZone.addEventListener('dragleave', () => {
    dropZone.style.borderColor = '#e2e6ef';
    dropZone.style.background = '#fafbff';
});

dropZone.addEventListener('drop', e=>{
    dropZone.style.borderColor='#e2e6ef';
    dropZone.style.background='#fafbff';
    handleFileList(e.dataTransfer.files);
});

clearBtn.addEventListener('click', () => {
    stopAllAudio();
    container.innerHTML='';
    objectUrls.forEach(u => URL.revokeObjectURL(u));
    objectUrls.length = 0;
});

loadFolderBtn.addEventListener('click', async ()=>{
    if(typeof window.showDirectoryPicker !== 'function'){
        alert('Your browser does not support folder selection.');
        return;
    }
    try{
        const dirHandle = await window.showDirectoryPicker();
        for await (const [name,handle] of dirHandle.entries()){
            if(handle.kind === 'file' && /\.wav$/i.test(name)){
                const file = await handle.getFile();
                await handleFile(file);
            }
        }
    }catch(e){}
});

(async function(){
    try{
        const res = await fetch('./list');
        if(!res.ok) return;
        const names = await res.json();
        if(!Array.isArray(names)) return;
        names.sort((a,b)=>a.localeCompare(b, undefined, { sensitivity:'base' })).forEach(name=>{
            if(/\.wav$/i.test(name)){
                addButton(filenameLabel(name), './'+encodeURIComponent(name), name);
            }
        });
    }catch{}
})();

// ===== Home button functionality =====
const homeBtn = document.getElementById('homeBtn');
homeBtn.addEventListener('click', () => {
    window.location.href = 'https://johart2030.github.io'; // replace with your main page URL
});
</script>

</body>
</html>
