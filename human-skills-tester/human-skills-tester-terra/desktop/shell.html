<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human Skills Tester Terra</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <header class="app-chrome">
    <div class="brand">
      <img src="https://johart2030.github.io/favicon-index-html.ico" alt="">
      <span>Human Skills Tester <b>Terra</b></span>
    </div>
    <nav class="pill-nav" aria-label="Desktop navigation">
      <button data-page="home" data-url="index.html">Home</button>
      <div class="games-menu">
        <button id="gamesToggle" aria-expanded="false" aria-controls="gamesList">Tests⌄</button>
        <div id="gamesList" class="games-list" hidden>
          <button data-url="reaction.html">Reaction Time</button>
          <button data-url="number-memory.html">Number Memory</button>
          <button data-url="pi-memory.html">Pi Memory</button>
          <button data-url="aim.html">Aim Trainer</button>
          <button data-url="sequence.html">Sequence Memory</button>
          <button data-url="visual-memory.html">Visual Memory</button>
          <button data-url="typing.html">Typing Test</button>
          <button data-url="math.html">Math Test</button>
        </div>
      </div>
      <button data-page="multiplayer" data-url="multiplayer.html">Multiplayer</button>
      <button data-page="friends" data-url="friends.html">Friends</button>
      <button data-page="leaderboards" data-url="leaderboards.html">Leaderboard</button>
      <button data-page="settings" data-url="settings.html">Settings</button>
      <button data-page="admin" data-url="admin.html" hidden>Admin</button>
    </nav>
    <div class="connection" aria-live="polite"><i></i><span id="connectionText">Loading profile</span></div>
  </header>
  <script src="shell-renderer.js"></script>
</body>
</html>
