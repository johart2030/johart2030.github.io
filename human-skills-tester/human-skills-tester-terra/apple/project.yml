name: HumanSkillsTesterTerra
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 5.9
targets:
  HumanSkillsTesterTerra-iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [HumanSkillsTesterTerra]
    info:
      properties:
        CFBundleDisplayName: Human Skills Terra
        CFBundleURLTypes:
          - CFBundleURLSchemes: [hstterra]
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johart2030.humanskillstesterterra
        TARGETED_DEVICE_FAMILY: "1,2"
  HumanSkillsTesterTerra-macOS:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources: [HumanSkillsTesterTerra]
    entitlements:
      path: Resources/HumanSkillsTesterTerra.entitlements
    info:
      properties:
        CFBundleDisplayName: Human Skills Terra
        CFBundleURLTypes:
          - CFBundleURLSchemes: [hstterra]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johart2030.humanskillstesterterra.mac
